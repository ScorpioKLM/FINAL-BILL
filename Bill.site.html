<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --ink:#000000;
  --au-navy-900:#050d1d;--au-navy-800:#091830;--au-navy-700:#0e2244;--au-navy-600:#15315e;
  --au-blue:#3a7cc4;--au-gold:#c8a24a;--au-gold-2:#e3c074;--au-gold-3:#f4dca2;
  --au-cream:#f1ead9;--au-muted:#8a8270;--au-line:rgba(200,162,74,.20);--au-line-2:rgba(200,162,74,.42);
  --vo-black:#060606;--vo-panel:#111112;--vo-white:#f6f5f2;--vo-silver:#b6b5b1;--vo-grey:#7d7d7a;
  --vo-line:rgba(246,245,242,.14);--vo-line-2:rgba(246,245,242,.30);
  --ease:cubic-bezier(.16,.84,.34,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body{font-family:"Cormorant Garamond",Georgia,serif;background:var(--ink);color:var(--au-cream);overflow-x:hidden;overflow-y:auto;max-width:100vw;line-height:1.6;touch-action:pan-y;-webkit-overflow-scrolling:touch}
img,video{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--au-gold-2);outline-offset:3px}
::selection{background:rgba(200,162,74,.32);color:#fff}
.page{display:none}
.page.active{display:block}
.cz{font-family:"Cinzel",Georgia,serif}

/* shared overlays */
#cursor-glow{position:fixed;top:0;left:0;width:460px;height:460px;border-radius:50%;pointer-events:none;z-index:9990;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(200,162,74,.10),transparent 62%);opacity:0;transition:opacity .4s;mix-blend-mode:screen;will-change:transform}
body.show-cursor #cursor-glow{opacity:1}
#progress-bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:9995;background:linear-gradient(90deg,var(--au-gold),var(--au-gold-3));transition:width .12s linear}
.to-top{position:fixed;bottom:1.3rem;left:1.3rem;z-index:280;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--au-line-2);background:rgba(5,13,29,.8);color:var(--au-gold-2);cursor:pointer;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s,background .25s;backdrop-filter:blur(6px)}
.to-top.on{opacity:1;transform:none}
.to-top:hover{background:var(--au-gold);color:var(--au-navy-900)}

/* reveal */
.reveal{opacity:0;transform:translateY(48px) scale(.94);transition:opacity .9s var(--ease),transform .9s var(--ease);will-change:transform,opacity}
.reveal.in{opacity:1;transform:none}
.reveal.out{opacity:.35;transform:translateY(28px) scale(.97)}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}
/* universal pop on cards/sections as they enter view — visible by default, animates when .in is added */
@keyframes bbPop{0%{transform:translateY(40px) scale(.9);opacity:0}55%{transform:translateY(-4px) scale(1.025);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.bb-pop.in{animation:bbPop .85s var(--ease) both}
.bb-pop.out{opacity:.55;transform:translateY(18px) scale(.98);transition:opacity .5s,transform .5s}
/* parallax drift on hero/banner imagery */
.bb-parallax{will-change:transform;transition:transform .1s linear}

/* =========================================================
   LANDING
   ========================================================= */
#page-landing{background:var(--ink);min-height:min(100svh,820px);flex-direction:column;position:relative}
#page-landing.active{display:flex}
.land-stars{display:none}
@keyframes twinkle{from{opacity:.45}to{opacity:.85}}
.land-aura{display:none}
.land-burger{position:fixed;top:1.1rem;right:1.1rem;z-index:301}
.land-head{position:relative;z-index:2;text-align:center;padding:0 0 .2rem;width:100%}
.land-logo-link{display:block;width:100%;text-decoration:none;outline-offset:10px}
/* logo blends full page-width: screen blend + horizontal feather kills any plate/edge so it reads as part of the black background */
.land-logo{display:block;width:100%;max-width:none;height:auto;margin:0 auto;mix-blend-mode:screen;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
 mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
 filter:drop-shadow(0 0 60px rgba(58,124,196,.16))}
.land-eyebrow{color:var(--au-gold-2);font-family:"Jost",sans-serif;font-size:clamp(.56rem,1.4vw,.74rem);letter-spacing:.32em;text-transform:uppercase;margin-top:.2rem}
.land-divider{width:min(700px,78vw);height:1px;margin:1.4rem auto .2rem;background:linear-gradient(90deg,transparent,var(--au-line-2),transparent)}
.land-main{position:relative;z-index:2;flex:1;display:flex;align-items:center;padding:clamp(1rem,3vw,2.4rem) 0}
.land-cards{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:clamp(1.3rem,3vw,2.4rem);max-width:1420px;margin:0 auto;width:94vw}
.land-card{position:relative;flex:1 1 380px;max-width:600px;min-width:266px;border-radius:20px;overflow:hidden;text-decoration:none;isolation:isolate;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:#000;box-shadow:0 24px 70px rgba(0,0,0,.6);transition:transform .5s var(--ease),border-color .5s,box-shadow .5s}
.land-card .placard{width:100%;height:auto;transition:transform .8s var(--ease)}
.land-card .sheen{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.16) 48%,transparent 60%);transform:translateX(-130%);transition:transform .9s var(--ease)}
.land-card:hover{transform:translateY(-8px) scale(1.012)}
.land-card.author:hover{border-color:var(--au-gold-2);box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 50px rgba(58,124,196,.25)}
.land-card.voice:hover{border-color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 50px rgba(255,255,255,.12)}
.land-card:hover .placard{transform:scale(1.05)}
.land-card:hover .sheen{transform:translateX(130%)}
.land-foot{position:relative;z-index:2;max-width:1100px;margin:0 auto;width:100%;padding:1.4rem 1rem 2rem;border-top:1px solid rgba(255,255,255,.08);text-align:center}
.land-foot p{color:rgba(241,234,217,.5);font-family:"Jost",sans-serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.8rem}
.land-foot nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem .9rem}
.land-foot nav a{color:var(--au-gold-2);text-decoration:none;font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.1em;cursor:pointer;white-space:nowrap}
.land-foot nav a:hover{color:var(--au-gold-3)}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{display:inline-flex;align-items:center;gap:.5rem;justify-content:center;padding:.9rem 1.6rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;text-decoration:none;font-family:"Jost",sans-serif;font-size:.74rem;cursor:pointer;border:1px solid transparent;border-radius:3px;transition:transform .25s var(--ease),background .25s,color .25s,box-shadow .25s,border-color .25s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--au-gold);color:var(--au-navy-900)}
.btn-gold:hover{background:var(--au-gold-2);transform:translateY(-3px);box-shadow:0 12px 30px rgba(200,162,74,.3)}
.btn-go{background:transparent;color:var(--au-cream);border-color:rgba(241,234,217,.3)}
.btn-go:hover{border-color:var(--au-gold);color:var(--au-gold-2);transform:translateY(-3px)}
.btn-gline{background:transparent;color:var(--au-gold-2);border-color:var(--au-gold)}
.btn-gline:hover{background:var(--au-gold);color:var(--au-navy-900);transform:translateY(-3px)}
.btn-wt{background:var(--vo-white);color:var(--vo-black)}
.btn-wt:hover{background:#fff;transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,255,255,.16)}
.btn-wo{background:transparent;color:var(--vo-white);border-color:var(--vo-line-2)}
.btn-wo:hover{border-color:#fff;transform:translateY(-3px)}

/* =========================================================
   AUTHOR
   ========================================================= */
#page-author{background:var(--au-navy-900);color:var(--au-cream)}
.au-sec{padding:clamp(4rem,8vw,7rem) 1.25rem;position:relative}
.au-wrap{max-width:1140px;margin:0 auto}
.au-label{font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.46em;text-transform:uppercase;color:var(--au-gold);margin-bottom:.9rem}
.au-title{font-family:"Cinzel",serif;font-size:clamp(1.8rem,4vw,2.9rem);font-weight:600;line-height:1.14;color:var(--au-cream)}
.au-rule{width:62px;height:1px;background:var(--au-gold);margin:1.1rem 0 1.8rem}
.au-rule.c{margin-left:auto;margin-right:auto}
.au-p{color:rgba(241,234,217,.82);font-size:1.08rem}

.au-nav{position:fixed;top:3px;left:0;width:100%;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:1.1rem clamp(1.25rem,4vw,2.4rem);background:rgba(5,13,29,.55);backdrop-filter:blur(16px);border-bottom:1px solid var(--au-line);transition:padding .3s,background .3s}
.au-nav.scrolled{padding:.7rem clamp(1.25rem,4vw,2.4rem);background:rgba(5,13,29,.93)}
.au-nav-logo{font-family:"Cinzel",serif;font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--au-gold);text-decoration:none}
.au-nav-links{display:flex;gap:1.7rem;list-style:none;align-items:center}
.au-nav-links a{font-family:"Jost",sans-serif;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--au-cream);text-decoration:none;opacity:.74;transition:opacity .2s,color .2s;cursor:pointer}
.au-nav-links a:hover{opacity:1;color:var(--au-gold-2)}
.au-nav-links .navcta{opacity:1;background:var(--au-gold);color:var(--au-navy-900);padding:.5rem 1.2rem;font-weight:600;border-radius:2px}
.au-nav-links .navcta:hover{background:var(--au-gold-2)}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:.4rem;z-index:301}
.burger span{display:block;width:26px;height:2px;background:var(--au-gold);transition:.3s}
.burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:298;backdrop-filter:blur(2px)}
.nav-scrim.on{display:block}

#au-hero{min-height:min(100svh,820px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:8rem 1.25rem 5rem}
.hl{position:absolute;inset:-12%;will-change:transform}
.hl-base{background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(58,124,196,.16),transparent 64%),linear-gradient(180deg,#050d1d,#0c1c3a 52%,#050d1d)}
.hl-grid{opacity:.5;background-image:repeating-linear-gradient(0deg,var(--au-line) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,var(--au-line) 0 1px,transparent 1px 64px);-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 40%,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse 80% 80% at 50% 40%,#000 30%,transparent 78%)}
.hl-glow{background:radial-gradient(circle at 50% 38%,rgba(200,162,74,.1),transparent 46%)}
.au-arc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,120vw);height:min(1100px,120vw);border-radius:50%;border:1px solid var(--au-line-2);-webkit-mask-image:linear-gradient(180deg,transparent 8%,#000 42%,transparent 70%);mask-image:linear-gradient(180deg,transparent 8%,#000 42%,transparent 70%);opacity:.6;will-change:transform}
.au-arc::after{content:"";position:absolute;left:50%;top:0;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);background:var(--au-gold-3);box-shadow:0 0 22px 5px rgba(244,220,162,.6)}
.au-hero-inner{position:relative;z-index:3;text-align:center;max-width:920px}
.au-hero-eyebrow{font-family:"Jost",sans-serif;font-size:.64rem;letter-spacing:.46em;text-transform:uppercase;color:var(--au-gold);margin-bottom:1.6rem;opacity:0;animation:fu .9s .2s forwards}
.au-hero-name{font-family:"Cinzel",serif;font-weight:700;line-height:.98;letter-spacing:.04em;font-size:clamp(3.4rem,11vw,8rem);opacity:0;animation:fu 1s .35s forwards}
.au-hero-name .f{color:var(--au-cream)}
.au-hero-name .l{display:block;background:linear-gradient(100deg,var(--au-gold) 10%,var(--au-gold-3) 40%,var(--au-gold) 60%,var(--au-gold-3) 90%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fu 1s .35s forwards,shine 6s linear infinite}
@keyframes shine{to{background-position:220% center}}
.au-hero-rule{width:84px;height:1px;background:var(--au-gold);margin:1.8rem auto;opacity:0;animation:fu .9s .55s forwards}
.au-hero-role{font-family:"Jost",sans-serif;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--au-muted);margin-bottom:1.4rem;opacity:0;animation:fu .9s .65s forwards}
.au-hero-tag{font-size:clamp(1.15rem,2.4vw,1.55rem);font-weight:300;color:rgba(241,234,217,.85);max-width:640px;margin:0 auto 2.6rem;opacity:0;animation:fu .9s .78s forwards}
.au-hero-tag em{color:var(--au-gold-2);font-style:normal}
.au-hero-cta{display:inline-flex;gap:1rem;flex-wrap:wrap;justify-content:center;opacity:0;animation:fu .9s .92s forwards}
@keyframes fu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.au-about{background:var(--au-navy-700)}
.about-banner{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--au-line);overflow:hidden;border-radius:6px}
.about-photo{position:relative;display:block;background:var(--au-navy-800) center/cover no-repeat;background-image:url("https://res.cloudinary.com/brookssite/image/upload/v1782155826/1000039129_dgyq1v.png");min-height:340px;aspect-ratio:4/5;border-radius:20%;overflow:hidden}
.about-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:20%}
.about-body{background:var(--au-navy-800);padding:clamp(2.4rem,4vw,3.6rem) clamp(1.6rem,3vw,2.6rem);display:flex;flex-direction:column;justify-content:center}
/* optimized label pills — compact, auto width, wrap as tags */
.tags{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.5rem 0}
.tag{flex:0 0 auto;font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--au-gold-2);border:1px solid var(--au-line-2);padding:.46rem .9rem;border-radius:999px;background:rgba(200,162,74,.06);white-space:nowrap}
.pull{font-style:italic;color:var(--au-gold-3);margin:1rem 0;font-size:1.1rem}

.marquee{overflow:hidden;border-top:1px solid var(--au-line);border-bottom:1px solid var(--au-line);background:var(--au-navy-900);padding:.9rem 0;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:inline-flex;gap:2.6rem;animation:scrollx 22s linear infinite;font-family:"Jost",sans-serif;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--au-muted)}
.marquee-track b{color:var(--au-gold-2);font-weight:500}
@keyframes scrollx{to{transform:translateX(-50%)}}

.au-strip{background:var(--au-navy-800);padding:2.4rem 1rem}
.strip-grid{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.strip-item{text-align:center;padding:1rem;border-right:1px solid var(--au-line)}
.strip-item:last-child{border-right:none}

.strip-lab{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--au-muted)}

.au-video{background:var(--au-navy-800)}
.video-wrap{position:relative;aspect-ratio:16/9;border:1px solid var(--au-gold);overflow:hidden;border-radius:4px;box-shadow:0 0 0 1px rgba(200,162,74,.15),0 18px 60px rgba(0,0,0,.5);max-width:900px;margin:0 auto;background:var(--au-navy-700)}
.video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.au-books{background:var(--au-navy-800)}
.book-row{display:grid;grid-template-columns:288px 1fr;gap:clamp(2rem,5vw,4rem);align-items:start;padding-bottom:4.5rem;margin-bottom:4.5rem;border-bottom:1px solid var(--au-line)}
.book-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.book-cover{width:100%;border:1px solid var(--au-line-2);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s;background:var(--au-navy-700);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.book-cover img{width:100%;height:auto;display:block}
.book-cover .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,13,29,.82);opacity:0;transition:opacity .3s;z-index:4}
.book-cover:hover .ov{opacity:1}
.book-cover .ov span{font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--au-gold-2);border:1px solid var(--au-gold);padding:.7rem 1.4rem}
/* cinematic Creation Story cover */
.cine{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;background:radial-gradient(circle at 50% 32%,#1a2b52,#0a1426 60%,#04080f)}
.cine video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:grayscale(.2) contrast(1.1);z-index:0}
.cine .burst{position:absolute;left:50%;top:34%;width:240px;height:240px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(244,220,162,.55),rgba(58,124,196,.18) 38%,transparent 66%);filter:blur(6px);animation:breathe 5.5s ease-in-out infinite;z-index:1}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.cine .ray{position:absolute;inset:0;z-index:1;background:conic-gradient(from 0deg at 50% 34%,transparent,rgba(244,220,162,.10) 8%,transparent 16%,transparent 50%,rgba(244,220,162,.08) 58%,transparent 66%);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 34%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 34%,#000,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cine-inner{position:relative;z-index:2}
.cine-inner .mk{font-size:1.6rem;color:rgba(244,220,162,.7);margin-bottom:.6rem}
.cine-inner .tt{font-family:"Cinzel",serif;font-size:1.5rem;font-weight:700;color:var(--au-gold-3);line-height:1.15;letter-spacing:.04em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.cine-inner .au{font-family:"Jost",sans-serif;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--au-cream);opacity:.8;margin-top:.7rem}
.book-badge{font-family:"Jost",sans-serif;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--au-navy-900);background:var(--au-gold);padding:.34rem .9rem;display:inline-block;margin-bottom:1rem;font-weight:600;border-radius:2px}
.book-badge.alt{background:transparent;color:var(--au-gold-2);border:1px solid var(--au-gold)}

/* podcast + blog */
.au-media{background:var(--au-navy-900)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,3.5rem);align-items:start}
.media-col h3{font-family:"Cinzel",serif;font-size:1.3rem;color:var(--au-gold-2);margin-bottom:.3rem}
.media-sub{font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--au-muted);margin-bottom:1.3rem}
.pod-loading{font-family:"Jost",sans-serif;font-size:.74rem;color:var(--au-muted);padding:.8rem 0}
.pod-ep,.blog-ep{border:1px solid var(--au-line);background:var(--au-navy-800);border-radius:8px;padding:1.05rem 1.15rem;margin-bottom:.85rem;transition:border-color .3s,transform .3s}
.pod-ep:hover,.blog-ep:hover{border-color:var(--au-line-2);transform:translateY(-2px)}
.ep-top{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;margin-bottom:.4rem}
.ep-title{font-family:"Cinzel",serif;font-size:.98rem;color:var(--au-gold-2);line-height:1.3}
.ep-date{font-family:"Jost",sans-serif;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--au-muted);white-space:nowrap;flex-shrink:0}
.ep-desc{font-size:.95rem;color:rgba(241,234,217,.7);margin-bottom:.7rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pod-ep audio{width:100%;height:40px;border-radius:6px;outline:none}
.blog-ep a.rd,.pod-ep a.rd{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--au-gold);text-decoration:none}
.blog-ep a.rd:hover,.pod-ep a.rd:hover{color:var(--au-gold-3)}
/* cinematic trailer wrapper for blog videos — anamorphic film frame */
.ctrailer{position:relative;width:100%;aspect-ratio:21/9;margin:.2rem 0 .85rem;border-radius:4px;overflow:hidden;background:#000;box-shadow:0 18px 50px -22px rgba(0,0,0,.9),inset 0 0 0 1px rgba(200,162,74,.28),inset 0 0 60px rgba(0,0,0,.6);isolation:isolate;cursor:pointer}
.ctrailer .blog-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);transition:transform 9s ease-out,filter .5s;filter:contrast(1.08) saturate(1.05)}
.ctrailer:hover .blog-video{transform:scale(1.16);filter:contrast(1.14) saturate(1.15) brightness(1.06)}
/* film-grain scanlines + vignette */
.ctrailer::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.85) 100%);mix-blend-mode:multiply;opacity:.9}
/* corner ticks like a viewfinder */
.ctrailer::after{content:"";position:absolute;inset:8px;z-index:4;pointer-events:none;border:1px solid transparent;background:
  linear-gradient(var(--au-gold),var(--au-gold)) left top/14px 1px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) left top/1px 14px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) right top/14px 1px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) right top/1px 14px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) left bottom/14px 1px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) left bottom/1px 14px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) right bottom/14px 1px no-repeat,
  linear-gradient(var(--au-gold),var(--au-gold)) right bottom/1px 14px no-repeat;
  opacity:.55;transition:opacity .4s}
.ctrailer:hover::after{opacity:.9}
.ctrailer .cine-grade{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 80% at 50% 110%,rgba(200,162,74,.22),transparent 55%),linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(10,17,40,.55) 100%);mix-blend-mode:screen;opacity:.9}
.ctrailer .cine-badge{position:absolute;top:14px;left:14px;z-index:5;font-family:"Jost",sans-serif;font-size:.5rem;letter-spacing:.36em;text-transform:uppercase;color:var(--au-gold);background:rgba(10,17,40,.55);border:1px solid rgba(200,162,74,.5);padding:.32rem .6rem;border-radius:2px;display:flex;align-items:center;gap:.5rem}
.ctrailer .cine-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#e94545;box-shadow:0 0 8px #e94545;animation:recBlink 1.4s ease-in-out infinite}
@keyframes recBlink{0%,100%{opacity:1}50%{opacity:.25}}
.ctrailer .cine-tc{position:absolute;top:14px;right:14px;z-index:5;font-family:"JetBrains Mono",monospace,"Jost";font-size:.55rem;letter-spacing:.18em;color:var(--au-gold-2);background:rgba(10,17,40,.55);border:1px solid rgba(200,162,74,.35);padding:.3rem .55rem;border-radius:2px}
.ctrailer .cine-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:60px;height:60px;border-radius:50%;background:rgba(200,162,74,.92);display:grid;place-items:center;color:var(--au-navy-900);box-shadow:0 0 0 0 rgba(200,162,74,.55);animation:cinePulse 2.2s infinite;pointer-events:none}
.ctrailer .cine-play svg{width:24px;height:24px;margin-left:3px}
@keyframes cinePulse{0%{box-shadow:0 0 0 0 rgba(200,162,74,.6)}70%{box-shadow:0 0 0 24px rgba(200,162,74,0)}100%{box-shadow:0 0 0 0 rgba(200,162,74,0)}}
.ctrailer.playing .cine-play,.ctrailer.playing .cine-badge,.ctrailer.playing .cine-tc,.ctrailer.playing .cine-grade{opacity:0;transition:opacity .35s}
.blog-video{width:100%;border-radius:6px;background:#000;display:block}

.subscribe-bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
.sub-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.1rem;border-radius:999px;font-family:"Jost",sans-serif;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid var(--au-line-2);color:var(--au-gold-2);background:rgba(200,162,74,.06);transition:all .25s}
.sub-btn:hover{background:var(--au-gold);color:var(--au-navy-900);border-color:var(--au-gold);transform:translateY(-2px)}
.sub-btn svg{width:15px;height:15px;fill:currentColor}

.au-themes{background:var(--au-navy-800)}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin-top:1rem}
.theme-card{border:1px solid var(--au-line);background:var(--au-navy-700);padding:2.4rem 1rem;text-align:center;border-radius:6px;transition:transform .35s var(--ease),border-color .35s,background .35s}
.theme-card:hover{transform:translateY(-6px);border-color:var(--au-line-2);background:var(--au-navy-600)}
.theme-mark{font-family:"Cinzel",serif;font-size:2.4rem;color:var(--au-gold);margin-bottom:.6rem}
.theme-word{font-family:"Cinzel",serif;font-size:1.15rem;font-weight:600;color:var(--au-gold-2);letter-spacing:.06em;margin-bottom:.8rem}
.theme-desc{font-size:.92rem;color:var(--au-muted)}

.au-reviews{background:var(--au-navy-700)}
.featured{background:var(--au-navy-800);border:1px solid var(--au-line-2);padding:clamp(2rem,4vw,3rem);border-radius:8px;margin:2rem 0 .8rem;text-align:center}
.featured p{font-size:1.25rem;font-style:italic;color:rgba(241,234,217,.9);line-height:1.7;max-width:760px;margin:0 auto}
.featured .who{font-family:"Cinzel",serif;color:var(--au-gold-2);margin-top:1rem}
.featured .role{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--au-muted);margin-top:.3rem}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem}
.rev{padding:1.8rem;border:1px solid var(--au-line);background:var(--au-navy-800);border-radius:6px;transition:transform .3s,border-color .3s}
.rev:hover{transform:translateY(-4px);border-color:var(--au-line-2)}
.stars{color:var(--au-gold);font-size:.78rem;letter-spacing:.18em;margin-bottom:.7rem}
.rev p{font-style:italic;color:rgba(241,234,217,.84);margin-bottom:.8rem}
.rev .by{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--au-gold)}
/* testimonials marquee */
.rev-marquee{overflow:hidden;margin-top:.2rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.rev-track{display:flex;gap:1.2rem;width:max-content;animation:revscroll 14s linear infinite}
.rev-marquee:hover .rev-track{animation-play-state:paused}
.rev-track .rev{flex:0 0 300px;margin:0}
@keyframes revscroll{to{transform:translateX(-50%)}}

.au-speaking{background:var(--au-navy-800)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:start}
.topic{display:flex;align-items:center;gap:.9rem;padding:.8rem 1.1rem;border:1px solid var(--au-line);background:var(--au-navy-700);margin-bottom:.8rem;border-radius:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--au-gold);flex-shrink:0}
.form-card{background:var(--au-navy-700);border:1px solid var(--au-line);padding:clamp(1.8rem,3vw,2.5rem);border-radius:8px}
.fg{margin-bottom:1.1rem}
.fg input,.fg textarea{width:100%;background:var(--au-navy-800);border:1px solid var(--au-line);color:var(--au-cream);font-family:"Cormorant Garamond",serif;font-size:1.05rem;padding:.85rem 1.1rem;border-radius:4px;outline:none}
.fg input:focus,.fg textarea:focus{border-color:var(--au-gold)}

.au-contact{background:var(--au-navy-700)}
.au-lead{background:linear-gradient(140deg,var(--au-navy-800),var(--au-navy-900))}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.magnet{background:var(--au-navy-800);border:1px solid var(--au-line);padding:clamp(2rem,4vw,3rem);text-align:center;position:relative;border-radius:8px}
.magnet::before{content:"FREE";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-family:"Jost",sans-serif;font-size:.58rem;letter-spacing:.34em;font-weight:600;background:var(--au-gold);color:var(--au-navy-900);padding:.34rem 1.2rem;border-radius:2px}
.magnet .ic{font-size:2.6rem;margin-bottom:.8rem}
.lead-form input{width:100%;background:var(--au-navy-800);border:1px solid var(--au-line);color:var(--au-cream);font-family:"Jost",sans-serif;font-size:.86rem;padding:.95rem 1.2rem;margin-bottom:.9rem;border-radius:4px;outline:none}
.lead-form input:focus{border-color:var(--au-gold)}

/* author footer */
.au-foot{background:var(--au-navy-800);border-top:1px solid var(--au-line)}
.foot-grid{max-width:1140px;margin:0 auto;padding:4rem 1.5rem 2.4rem;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:2rem}
.foot-col h4{font-family:"Cinzel",serif;font-size:.8rem;letter-spacing:.1em;color:var(--au-cream);margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center}
.foot-col h4 .acc{display:none}
.foot-col ul{list-style:none;display:flex;flex-direction:column;gap:.7rem}
.foot-col a{font-family:"Jost",sans-serif;font-size:.7rem;letter-spacing:.12em;color:var(--au-muted);text-decoration:none;cursor:pointer}
.foot-col a:hover{color:var(--au-gold-2)}
.foot-blurb{font-size:1rem;color:var(--au-muted);max-width:300px;margin-bottom:1.2rem}
.socials{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.foot-col.connect{display:flex;justify-content:center}
.soc{width:38px;height:38px;border-radius:50%;border:1px solid var(--au-line-2);display:flex;align-items:center;justify-content:center;color:var(--au-gold-2);transition:all .25s}
.soc:hover{background:var(--au-gold);color:var(--au-navy-900);border-color:var(--au-gold);transform:translateY(-3px)}
.soc svg{width:16px;height:16px;fill:currentColor}
/* inline success toast */
.bb-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:rgba(10,17,40,.92);color:#7be38a;border:1px solid rgba(123,227,138,.45);font-family:"Jost",sans-serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;padding:.75rem 1.4rem;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;z-index:9999}
.bb-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bb-toast.err{color:#ff9a9a;border-color:rgba(255,154,154,.45)}
.soc-more{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:.9rem}
.soc-more a{font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.1em;color:var(--au-muted);text-decoration:none}
.soc-more a:hover{color:var(--au-gold-2)}
.foot-bottom{border-top:1px solid var(--au-line);max-width:1140px;margin:0 auto;padding:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.foot-copy{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.06em;color:var(--au-muted);white-space:nowrap}

#au-float{position:fixed;bottom:1.4rem;right:1.4rem;z-index:280;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s;pointer-events:none}
#au-float.on{opacity:1;transform:none;pointer-events:auto}
.float-btn{display:flex;align-items:center;gap:.4rem;background:var(--au-gold);color:var(--au-navy-900);text-decoration:none;font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:.65rem 1rem;border-radius:3px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.float-btn:hover{background:var(--au-gold-2)}

/* =========================================================
   VOICEOVER
   ========================================================= */
#page-voiceover{background:var(--vo-black);color:var(--vo-white);font-family:"Jost",Arial,sans-serif}
.vo-grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.vo-sec{padding:clamp(4rem,8vw,6.5rem) clamp(1.25rem,6vw,4rem);position:relative;z-index:2}
.vo-sec.alt{background:var(--vo-panel)}
.vo-wrap{max-width:1180px;margin:0 auto}
.vo-label{font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.46em;text-transform:uppercase;color:var(--vo-grey);margin-bottom:.9rem}
.vo-h{font-family:"Cinzel",serif;font-size:clamp(1.7rem,4vw,2.8rem);font-weight:600;line-height:1.14;color:var(--vo-white)}
.vo-rule{width:60px;height:1px;background:var(--vo-white);margin:1.1rem 0 1.6rem;opacity:.6}
.vo-p{color:var(--vo-silver);font-family:"Cormorant Garamond",serif;font-size:1.15rem}
.vo-nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1.25rem,5vw,4rem);background:rgba(6,6,6,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--vo-line)}
.vo-logo{width:min(210px,52vw)}
.vo-links{display:flex;gap:1.4rem;align-items:center}
.vo-links a{color:var(--vo-silver);text-decoration:none;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;transition:color .2s;cursor:pointer}
.vo-links a:hover,.vo-links .back{color:#fff}
.vo-burger{display:none;background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer;z-index:102}
.vo-hero{min-height:min(92svh,820px);display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,4rem);align-items:center;padding:clamp(4rem,9vw,7rem) clamp(1.25rem,6vw,4rem);position:relative;overflow:hidden;background:radial-gradient(circle at 80% 40%,rgba(255,255,255,.06),transparent 40%),linear-gradient(140deg,#050505,#161616 50%,#050505)}
.vo-hero-bg{position:absolute;inset:-10%;z-index:0;opacity:.4;will-change:transform;background-image:repeating-linear-gradient(90deg,var(--vo-line) 0 1px,transparent 1px 70px);-webkit-mask-image:radial-gradient(ellipse 70% 80% at 30% 50%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 80% at 30% 50%,#000,transparent 75%)}
.vo-hero>div{position:relative;z-index:2}
.vo-eyebrow{color:var(--vo-silver);font-size:.7rem;letter-spacing:.36em;text-transform:uppercase}
.vo-hero h1{font-family:"Cinzel",serif;font-size:clamp(3.2rem,9vw,7rem);line-height:.95;color:#fff;margin:.5rem 0}
.vo-hero h2{font-family:"Cinzel",serif;color:var(--vo-silver);font-size:clamp(1.3rem,3vw,2.3rem);margin-bottom:.8rem;font-weight:500}
.vo-subline{color:var(--vo-grey);letter-spacing:.14em;text-transform:uppercase;font-size:.74rem}
.vo-tagline{font-family:"Cormorant Garamond",serif;font-size:1.4rem;color:rgba(246,245,242,.78);font-style:italic;margin-top:1rem}
.vo-hero-media img{width:100%;height:auto;max-height:none;object-fit:contain;border:1px solid var(--vo-line-2);filter:grayscale(.15) contrast(1.04);border-radius:20%;box-shadow:0 26px 70px rgba(0,0,0,.6);display:block}
.waveform{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:2rem}
.waveform i{flex:1;background:linear-gradient(var(--vo-white),var(--vo-grey));border-radius:2px;animation:wave 1.2s ease-in-out infinite;transform-origin:bottom;opacity:.8}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.vo-split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.vo-cardset{display:grid;gap:1rem}
.vo-card{background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--vo-line);padding:1.6rem;border-radius:6px;transition:transform .3s var(--ease),border-color .3s,background .3s}
.vo-card:hover{transform:translateY(-4px);border-color:var(--vo-line-2);background:rgba(255,255,255,.06)}
.vo-card h3{font-family:"Cinzel",serif;font-size:1rem;color:#fff;margin-bottom:.4rem}
.vo-card p{color:var(--vo-silver);font-size:.92rem;font-family:"Cormorant Garamond",serif}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2.4rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.4rem}
.genres{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.genres span{padding:.85rem 1.1rem;border:1px solid var(--vo-line-2);color:var(--vo-white);background:linear-gradient(135deg,rgba(201,162,74,.06),rgba(255,255,255,.02));font-size:.84rem;border-radius:999px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.vo-quote{background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--vo-line);padding:1.6rem;border-radius:6px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.05rem;color:rgba(246,245,242,.86)}
.vo-quote cite{display:block;font-style:normal;font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--vo-grey);margin-top:.8rem}
.vo-faq details{background:rgba(255,255,255,.03);border:1px solid var(--vo-line);padding:1.2rem 1.4rem;border-radius:6px;margin-bottom:.8rem}
.vo-faq summary{cursor:pointer;font-weight:500;list-style:none}
.vo-faq summary::-webkit-details-marker{display:none}
.vo-faq summary::after{content:"+";float:right;color:var(--vo-grey);font-size:1.2rem;line-height:1}
.vo-faq details[open] summary::after{content:"–"}
.vo-faq p{margin-top:.9rem;color:var(--vo-silver);font-family:"Cormorant Garamond",serif;font-size:1.05rem}
.au-faq-sec{background:var(--au-navy-700)}
.au-faq-list{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:.7rem}
.au-faq-list details{background:rgba(255,255,255,.04);border:1px solid var(--au-line);border-radius:8px;padding:1.1rem 1.3rem;transition:background .2s,border-color .2s}
.au-faq-list details[open]{background:rgba(201,169,97,.08);border-color:var(--au-gold)}
.au-faq-list summary{cursor:pointer;font-family:"Cormorant Garamond",serif;font-size:1.18rem;color:var(--au-cream);list-style:none;font-weight:500}
.au-faq-list summary::-webkit-details-marker{display:none}
.au-faq-list summary::after{content:"+";float:right;color:var(--au-gold);font-size:1.3rem;line-height:1;margin-left:1rem}
.au-faq-list details[open] summary::after{content:"–"}
.au-faq-list p{margin-top:.8rem;color:var(--au-muted);font-family:"Cormorant Garamond",serif;font-size:1.02rem;line-height:1.6}
.au-faq-list a{color:var(--au-gold)}
.vo-form{display:grid;gap:.9rem}
.vo-form input,.vo-form select,.vo-form textarea{width:100%;padding:.95rem 1rem;background:#0c0c0d;border:1px solid var(--vo-line-2);color:#fff;font-family:"Jost",sans-serif;border-radius:4px;outline:none}
.vo-form input:focus,.vo-form select:focus,.vo-form textarea:focus{border-color:#fff}
.vo-foot{padding:0 0 2.2rem;text-align:center;background:#040404;border-top:1px solid var(--vo-line);position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.2rem;overflow:hidden}
.vo-foot img{width:100vw;max-width:none;margin:0 calc(50% - 50vw);filter:none;display:block}
.vo-foot .socials{justify-content:center;margin:0;display:flex;flex-wrap:wrap;gap:.7rem}
.vo-foot .soc{border-color:var(--vo-line-2);color:var(--vo-white)}
.vo-foot .soc:hover{background:#fff;color:#000;border-color:#fff}
.vo-foot .legal{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem 1.4rem;margin:0;padding:0;list-style:none}
.vo-foot .legal a{color:var(--vo-grey);text-decoration:none;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.vo-foot .legal a:hover{color:#fff}
.vo-foot p{color:rgba(246,245,242,.5);font-size:.7rem;letter-spacing:.08em;margin:0}
/* VO marquees */
.vo-mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);margin-top:1.4rem}
.vo-mq-track{display:flex;gap:1rem;width:max-content;animation:vomq 20s linear infinite}
.vo-mq:hover .vo-mq-track{animation-play-state:paused}
.vo-mq-track .vo-card,.vo-mq-track .vo-quote,.vo-mq-track .vo-chip{flex:0 0 auto;margin:0}
.vo-mq-track .vo-card{width:240px}
.vo-mq-track .vo-quote{width:320px}
/* brand cards (Blue Gate / T3R) — upgraded event placards */
.brand-card{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-decoration:none;color:inherit;text-align:center;padding:2rem 1.35rem 3rem;border-radius:16px;border:1px solid rgba(232,201,122,.46);box-shadow:0 22px 60px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.06);position:relative;overflow:hidden;isolation:isolate;transition:transform .42s var(--ease),border-color .35s ease,box-shadow .35s ease,filter .35s ease}
.brand-card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(232,201,122,.38);border-radius:12px;pointer-events:none;z-index:-1}
.brand-card::after{content:"VIEW SITE ↗";position:absolute;bottom:1.05rem;left:50%;transform:translateX(-50%);font-family:"Jost",sans-serif;font-size:.56rem;letter-spacing:.26em;color:#f4d985;opacity:.82;white-space:nowrap;transition:opacity .3s,transform .3s}
.brand-card:nth-child(1){background:radial-gradient(circle at 50% 12%,rgba(89,151,195,.42),transparent 48%),linear-gradient(145deg,#071223,#102f50 50%,#06101f)}
.brand-card:nth-child(1)::before{box-shadow:inset 0 0 36px rgba(58,124,196,.24)}
.brand-card:nth-child(2){background:radial-gradient(circle at 50% 16%,rgba(232,201,122,.28),transparent 46%),linear-gradient(145deg,#050505,#17120a 48%,#050505)}
.brand-card:nth-child(2)::before{box-shadow:inset 0 0 44px rgba(232,201,122,.18)}
.brand-card:hover{transform:translateY(-7px) scale(1.015);border-color:#f4d985;box-shadow:0 32px 80px -22px rgba(232,201,122,.64),inset 0 0 0 1px rgba(255,255,255,.08);filter:saturate(1.08)}
.brand-card:hover::after{opacity:1;transform:translateX(-50%) translateY(-2px)}
.brand-card h3{font-family:"Cinzel",serif;font-size:clamp(1.1rem,2.6vw,1.55rem);letter-spacing:.06em;margin:.15rem 0 0;background:linear-gradient(120deg,#fff,#f6df95 54%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 14px 40px rgba(0,0,0,.55)}
.brand-card p{max-width:310px;color:rgba(255,255,255,.76);font-size:.94rem;line-height:1.55;padding-bottom:.3rem}
.brand-logo{width:min(86%,300px);height:clamp(112px,20vw,160px);object-fit:contain;padding:18px 24px;border-radius:14px;border:1px solid rgba(232,201,122,.45);box-shadow:0 18px 42px rgba(0,0,0,.58),0 0 0 6px rgba(255,255,255,.035);background:linear-gradient(180deg,#fffaf0,#efe5c7)}
.brand-card:nth-child(1) .brand-logo{background:linear-gradient(180deg,#fff,#eef7ff);filter:drop-shadow(0 0 18px rgba(104,174,230,.18))}
.brand-card:nth-child(2) .brand-logo{background:radial-gradient(circle,#191919 0,#050505 70%);padding:10px;border-radius:50%;height:clamp(130px,22vw,176px);width:clamp(130px,52vw,176px);filter:drop-shadow(0 0 22px rgba(232,201,122,.28))}
/* memberships marquee */
.mem-mq .vo-mq-track{gap:1.2rem;animation-duration:22s}
 .mem-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:linear-gradient(180deg,#fffdf6,#e8ddc3);border:1px solid rgba(232,201,122,.58);border-radius:16px;padding:16px 22px;min-width:258px;height:152px;box-shadow:0 22px 54px -26px rgba(232,201,122,.68),0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;text-decoration:none;position:relative;overflow:hidden}
 .mem-chip::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s ease;pointer-events:none}
 .mem-chip:hover{transform:translateY(-5px);border-color:#f6df95;box-shadow:0 28px 60px -24px rgba(232,201,122,.78),0 16px 34px rgba(0,0,0,.48)}
 .mem-chip:hover::after{transform:translateX(120%)}
 .mem-chip img{max-height:82px;max-width:210px;width:auto;height:auto;object-fit:contain;display:block;filter:contrast(1.08) saturate(1.08)}
 .mem-name{font-family:"Jost",sans-serif;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:#20180c;text-align:center;line-height:1.25;font-weight:700;max-width:210px}
.vo-chip{padding:.85rem 1.4rem;border:1px solid var(--vo-line-2);color:var(--vo-white);background:linear-gradient(135deg,rgba(201,162,74,.08),rgba(255,255,255,.02));font-size:.84rem;border-radius:999px;letter-spacing:.06em;white-space:nowrap;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
@keyframes vomq{to{transform:translateX(-50%)}}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem;margin:1.6rem 0}
.demo-card{background:rgba(255,255,255,.03);border:1px solid var(--vo-line);border-radius:6px;padding:1rem;text-align:left;display:flex;flex-direction:column;gap:.7rem}
.demo-card h3{font-family:"Cinzel",serif;color:#fff;font-size:1rem;margin:0;letter-spacing:.04em}
.demo-card iframe{width:100%;border:0;border-radius:4px;display:block}
.demo-dl{display:inline-flex;align-items:center;gap:.5rem;align-self:flex-start;font-family:"Jost",sans-serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--vo-gold);text-decoration:none;border:1px solid var(--vo-gold);padding:.55rem .9rem;border-radius:4px;transition:background .25s,color .25s,transform .25s}
.demo-dl:hover{background:var(--vo-gold);color:#0b1326;transform:translateY(-2px)}
.demo-dl svg{width:14px;height:14px;fill:currentColor}
.ab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.4rem 0}
.ab-card{display:block;background:rgba(255,255,255,.03);border:1px solid var(--vo-line);border-radius:6px;padding:1rem;text-align:center;text-decoration:none;color:inherit;transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
.ab-card:hover{transform:translateY(-4px);border-color:var(--vo-line-2);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.ab-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;display:block;margin-bottom:.8rem;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.ab-card .ab-t{font-family:"Cinzel",serif;color:#fff;font-size:.95rem;margin:.4rem 0 .3rem;line-height:1.25}
.ab-card .ab-a{color:var(--vo-silver);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.9rem;margin:0}
@media(max-width:720px){.ab-grid{grid-template-columns:1fr}}
/* star ratings */
.rate-row{display:flex;flex-direction:column;align-items:center;gap:.35rem;margin-top:.7rem}
.rate-stars{display:inline-flex;gap:2px}
.rate-stars button{background:none;border:0;padding:2px;cursor:pointer;color:#e8c97a;opacity:.55;transition:opacity .2s,color .2s,transform .2s,text-shadow .2s}
.rate-stars button:hover,.rate-stars button.hot{color:var(--vo-gold);opacity:1;transform:scale(1.12);text-shadow:0 0 10px rgba(232,201,122,.55)}
.rate-stars button svg{width:18px;height:18px;display:block;fill:currentColor}
.rate-cta{font-family:"Jost",sans-serif;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--vo-silver);opacity:.75}
.rate-row.au .rate-stars button:hover,.rate-row.au .rate-stars button.hot{color:var(--au-gold)}
.rate-row.au .rate-cta{color:var(--au-silver,#c8c8c8)}
.rate-multi{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.55rem}
.rate-multi a{font-family:"Jost",sans-serif;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--au-gold);text-decoration:none;border:1px solid var(--au-line-2);padding:.45rem .8rem;border-radius:999px;transition:all .25s}
.rate-multi a:hover{background:var(--au-gold);color:var(--au-navy-900);border-color:var(--au-gold);transform:translateY(-2px)}
/* share button */
.bb-share{display:inline-flex;align-items:center;gap:.4rem;background:none;border:1px solid rgba(200,162,74,.45);color:var(--au-gold,#c8a24a);font-family:"Jost",sans-serif;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;padding:.45rem .8rem;border-radius:999px;cursor:pointer;transition:background .2s,transform .2s,color .2s;margin-top:.6rem}
.bb-share:hover{background:rgba(200,162,74,.18);transform:translateY(-2px)}
.bb-share svg{width:12px;height:12px;fill:currentColor}
.pod-ep .bb-share,.blog-ep .bb-share{margin-right:.4rem}
/* clickable audiobook hint */
.ab-card{position:relative;overflow:hidden}
.ab-card .ab-cta{display:inline-flex;align-items:center;gap:.35rem;margin-top:.6rem;font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--vo-gold);border:1px solid var(--vo-gold);padding:.45rem .85rem;border-radius:999px;transition:background .25s,color .25s}
.ab-card:hover .ab-cta{background:var(--vo-gold);color:#0a0a0a}
.ab-card .ab-flag{position:absolute;top:.7rem;right:.7rem;background:var(--vo-gold);color:#0a0a0a;font-family:"Jost",sans-serif;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;padding:.28rem .55rem;border-radius:999px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:abPulse 2.4s ease-in-out infinite}
@keyframes abPulse{0%,100%{transform:scale(1);box-shadow:0 4px 14px rgba(200,162,74,.4)}50%{transform:scale(1.06);box-shadow:0 8px 22px rgba(200,162,74,.6)}}
/* trust badges */
.bb-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;margin-top:1rem}
.bb-trust span{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:999px;border:1px solid rgba(200,162,74,.3);background:rgba(200,162,74,.06);color:rgba(241,234,217,.74);font-family:"Jost",sans-serif;font-size:.55rem;letter-spacing:.16em;text-transform:uppercase}
.bb-trust svg{width:12px;height:12px;fill:var(--au-gold,#c8a24a)}
/* vo blog cards */
.vo-blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem;margin-top:1.6rem}
.vo-blog-card{background:rgba(255,255,255,.03);border:1px solid var(--vo-line);border-radius:6px;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem;transition:transform .3s,border-color .3s}
.vo-blog-card:hover{transform:translateY(-4px);border-color:var(--vo-gold)}
.vo-blog-card h3{font-family:"Cinzel",serif;color:#fff;font-size:1rem;margin:0;line-height:1.3}
.vo-blog-card p{color:var(--vo-silver);font-family:"Cormorant Garamond",serif;font-size:.95rem;margin:0}
.vo-blog-card a.rd{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--vo-gold);text-decoration:none;margin-top:auto}

/* =========================================================
   COOKIE BANNER + MODALS
   ========================================================= */
.cookie{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:400;max-width:560px;margin:0 auto;background:rgba(9,16,31,.96);border:1px solid var(--au-line-2);border-radius:12px;padding:1.2rem 1.3rem;box-shadow:0 18px 60px rgba(0,0,0,.6);backdrop-filter:blur(10px);transform:translateY(140%);transition:transform .5s var(--ease)}
.cookie.on{transform:none}
.cookie p{font-family:"Cormorant Garamond",serif;font-size:1rem;color:var(--au-cream);margin-bottom:.9rem}
.cookie p a{color:var(--au-gold-2);cursor:pointer}
.cookie-row{display:flex;gap:.6rem;flex-wrap:wrap}
.cookie .btn{padding:.65rem 1.2rem;font-size:.68rem}
.modal-scrim{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1.2rem}
.modal-scrim.on{display:flex}
.modal{background:#000;border:1px solid var(--au-line-2);border-radius:12px;max-width:680px;width:100%;max-height:84vh;overflow-y:auto;padding:clamp(1.6rem,4vw,2.6rem);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal h2{font-family:"Cinzel",serif;color:#fff;font-size:1.5rem;margin-bottom:.4rem}
.modal .upd{font-family:"Jost",sans-serif;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:1.2rem}
.modal h3{font-family:"Cinzel",serif;color:#fff;font-size:1.05rem;margin:1.2rem 0 .4rem}
.modal p{color:rgba(255,255,255,.86);margin-bottom:.7rem;font-size:1.02rem}
.modal strong{color:#fff}
.modal a{color:var(--au-gold-2)}
.modal .close{float:right;background:none;border:1px solid var(--au-line-2);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1}
.modal .close:hover{background:var(--au-gold);color:#000}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:980px){
  .au-nav-links{position:fixed;top:0;right:-100%;height:100svh;width:80%;max-width:320px;flex-direction:column;background:var(--au-navy-800);padding:5rem 2.2rem;gap:1.5rem;transition:right .35s var(--ease);z-index:300;align-items:flex-start;overflow-y:auto}
  .au-nav-links.open{right:0}
  .burger{display:flex}
  .media-grid,.two-col,.lead-grid,.about-banner,.book-row{grid-template-columns:1fr}
  .book-row{gap:2rem}.book-cover{max-width:260px;margin:0 auto}
  .theme-grid{grid-template-columns:repeat(2,1fr)}
  .vo-hero,.vo-split{grid-template-columns:1fr}
  .vo-hero-media{order:-1;max-width:440px;margin:0 auto}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .vo-links{position:fixed;top:0;right:-100%;height:100svh;width:80%;max-width:320px;flex-direction:column;background:rgba(6,6,6,.98);padding:5rem 2rem;gap:1.5rem;transition:right .3s var(--ease);z-index:101;align-items:flex-start}
  .vo-links.open{right:0}
  .vo-burger{display:block}
  .foot-grid{grid-template-columns:1fr;gap:0}
  .foot-col{border-bottom:1px solid var(--au-line);padding:1.1rem 0}
  .foot-col:last-child{border-bottom:none}
  .foot-col.connect{padding:1.4rem 0}
  .foot-col h4{margin-bottom:0;cursor:pointer}
  .foot-col.connect h4{cursor:default}
  .foot-col h4 .acc{display:inline;color:var(--au-gold);font-size:1.2rem}
  .foot-col.connect h4 .acc{display:none}
  .foot-col ul{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .foot-col ul.open{max-height:480px;margin-top:1rem}
  .foot-blurb{display:none}
  .foot-bottom{justify-content:center;text-align:center}
}
@media(max-width:620px){
  #au-hero{min-height:min(78svh,620px);padding:5.5rem 1.25rem 2.5rem}
  .au-sec{padding:3rem 1rem}
  .about-body{padding:1.8rem 1.4rem}
  .strip-grid{grid-template-columns:1fr 1fr}
  .strip-item:nth-child(odd){border-right:1px solid var(--au-line)}
  .strip-item:nth-child(even){border-right:none}
  .theme-grid,.grid4,.grid3,.genres{grid-template-columns:1fr}
  .foot-copy{white-space:normal;font-size:.56rem}
  .ep-top{flex-direction:column;align-items:flex-start;gap:.25rem}
  .ep-title{font-size:.92rem;line-height:1.35}
  .ep-date{font-size:.58rem}
}

/* reduced motion: keep gentle fades, drop loops + parallax + heavy motion */
@media(prefers-reduced-motion:reduce){
  .land-stars,.marquee-track,.waveform i,.au-hero-name .l,.cine .burst,.cine .ray,.pod-art::before,.au-arc{animation:none!important}
  #cursor-glow{display:none}
  .reveal{transition:opacity .5s ease;transform:none}
  .au-hero-eyebrow,.au-hero-name,.au-hero-rule,.au-hero-role,.au-hero-tag,.au-hero-cta{animation:none!important;opacity:1!important}
  html{scroll-behavior:auto}
}

/* ---- additions ---- */
.card-label{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:1.4rem 1.6rem 1.2rem;background:linear-gradient(transparent,rgba(0,0,0,0.82));font-family:"Cinzel",serif;font-size:clamp(0.9rem,2vw,1.15rem);letter-spacing:0.12em;color:#fff;text-align:center}
.land-card.author .card-label{color:var(--au-gold-2)}
.land-card.voice .card-label{color:#f6f5f2}
